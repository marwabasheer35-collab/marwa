name: Publish Nexa original rebuild
on:
  push:
    branches: [nexa-netlify-deploy]
    paths:
      - 'nexa_original_payload.b64'
      - '.github/workflows/nexa-original-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nexa-netlify-deploy
      - name: Reconstruct HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nexa-original
          base64 -d nexa_original_payload.b64 | gunzip > nexa-original/index.html
          test -s nexa-original/index.html
      - name: Commit rebuilt site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexa-original/index.html
          git commit -m "Publish rebuilt Nexa original site" || exit 0
          git push origin HEAD:nexa-netlify-deploy
