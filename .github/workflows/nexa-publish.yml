name: Publish Nexa static files
on:
  push:
    branches: [nexa-netlify-deploy]
    paths:
      - 'deploy_chunks/**'
      - '.github/workflows/nexa-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nexa-netlify-deploy
      - name: Reconstruct site
        shell: bash
        run: |
          set -euo pipefail
          cat deploy_chunks/chunk_*.txt > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          rm -rf nexa-site
          mkdir nexa-site
          unzip -q /tmp/site.zip -d nexa-site
          test -f nexa-site/index.html
      - name: Commit site files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexa-site
          git commit -m "Publish Nexa static site" || exit 0
          git push origin HEAD:nexa-netlify-deploy
